name: habitera
description: "Build habits. Shape your life. - Offline-first habit tracking app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Local Storage
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0
  path_provider: ^2.1.0
  path: ^1.8.3

  # UI & Theme
  google_fonts: ^6.1.0
  flutter_animate: ^4.1.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.0
  flutter_timezone: ^3.0.1

  # File Handling
  share_plus: ^7.2.0
  file_picker: ^8.0.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
